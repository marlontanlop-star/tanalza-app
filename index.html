const syncCollection = (collectionName, initialData, stateSetter) => {
    // Agregamos includeMetadataChanges para forzar la actualización inmediata
    return db.collection(collectionName).onSnapshot({ includeMetadataChanges: true }, snap => {
        if (snap.empty && initialData) {
            const batch = db.batch();
            initialData.forEach(item => {
                const ref = db.collection(collectionName).doc(item.id.toString());
                batch.set(ref, item);
            });
            batch.commit();
        } else {
            stateSetter(snap.docs.map(doc => doc.data()));
        }
    });
};

// 1. Iniciar Sesión con PKCE (Bloque Completo Corregido)
const loginSpotify = async () => {
    const clientId = "1fbda3da9ebd415597ec57f265fbb451";
    const redirectUri = "https://tanalza-app-dguk.vercel.app/";

    const generateRandomString = (length) => {
        const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        return Array.from(crypto.getRandomValues(new Uint8Array(length)))
            .map((x) => possible[x % possible.length]).join('');
    };

    const codeVerifier = generateRandomString(64);
    const sha256 = async (plain) => {
        const encoder = new TextEncoder();
        const data = encoder.encode(plain);
        return window.crypto.subtle.digest('SHA-256', data);
    };

    const base64encode = (input) => {
        return btoa(String.fromCharCode(...new Uint8Array(input)))
            .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    };

    const hashed = await sha256(codeVerifier);
    const codeChallenge = base64encode(hashed);

    window.localStorage.setItem('code_verifier', codeVerifier);

    const scopes = "user-read-playback-state user-modify-playback-state user-read-currently-playing streaming";
    
    // --- LÍNEA CLAVE CORREGIDA CON BACKTICKS ---
    const authUrl = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(scopes)}&code_challenge_method=S256&code_challenge=${codeChallenge}`;
    
    window.top.location.href = authUrl; // Cambié a window.top por seguridad en Vercel
};

// 2. Capturar Token (Vigilante de la llave)
React.useEffect(() => {

    if (code) {
        const clientId = "1fbda3da9ebd415597ec57f265fbb451";
        const redirectUri = "https://tanalza-app-dguk.vercel.app/";
        const codeVerifier = window.localStorage.getItem('code_verifier');

        fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                client_id: clientId,
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: redirectUri,
                code_verifier: codeVerifier,
            }),
        })
        .then(res => res.json())

                setSpotifyToken(data.access_token);

           const performClosure = async (isAuto = false, targetEmployee = null) => {
    // Si targetEmployee es null, usa el usuario actual. Si es "GENERAL", cierra a todos.
    const employeeToFilter = targetEmployee || currentShiftEmployee;
    const isGeneralClosure = targetEmployee === "GENERAL";

    // 1. Filtramos datos SOLO del empleado (o todos si es general) que no tengan shiftId
    const currentShiftOrders = orders.filter(o => 
        !o.shiftId && o.method !== 'credito' && 
        (isGeneralClosure ? true : o.employee === employeeToFilter)
    );
    const currentShiftExpenses = expenses.filter(e => 
        !e.shiftId && (isGeneralClosure ? true : e.employee === employeeToFilter)
    );
    const currentShiftAbonos = abonos.filter(a => 
        !a.shiftId && (isGeneralClosure ? true : a.employee === employeeToFilter)
    );
    const currentShiftAdjustments = cashAdjustments.filter(a => 
        !a.shiftId && (isGeneralClosure ? true : a.employee === employeeToFilter)
    );
    
    // Si no es automático y no hay nada que cerrar para este usuario
    if (!isAuto && currentShiftOrders.length === 0 && currentShiftAbonos.length === 0) {
        return alert(`El usuario ${employeeToFilter} no tiene ventas para cerrar.`);
    }

    // 2. Cálculos de Efectivo y Nequi (sobre los datos filtrados)
    let rawExpectedCash = currentShiftOrders.filter(o => o.method === 'efectivo').reduce((acc, o) => acc + o.total, 0);
    let nequiTotal = currentShiftOrders.filter(o => o.method === 'transferencia').reduce((acc, o) => acc + o.total, 0);

    const abonosEfectivo = currentShiftAbonos.filter(a => a.method === 'efectivo').reduce((acc, a) => acc + a.amount, 0);
    const abonosNequi = currentShiftAbonos.filter(a => a.method === 'transferencia').reduce((acc, a) => acc + a.amount, 0);

    rawExpectedCash += abonosEfectivo;
    nequiTotal += abonosNequi;

    const totalExpensesAmount = currentShiftExpenses.reduce((acc, e) => acc + e.amount, 0);
    const totalAdjustments = currentShiftAdjustments.reduce((acc, a) => acc + a.amount, 0);
    
    // Efectivo esperado final
    let expectedCash = rawExpectedCash - totalExpensesAmount + totalAdjustments;

    const countedCash = isAuto ? 0 : calculateCountedTotal();
    const diff = countedCash - expectedCash;
    const finalEmployeeName = isGeneralClosure ? "CIERRE GENERAL" : employeeToFilter;
    
    // Registro Items Manuales (solo para el reporte visual)
    const manualItems = [];
    currentShiftOrders.forEach(order => {
        order.items.forEach(item => {
            if (item.id.toString().startsWith('manual_')) {
                manualItems.push({ date: order.date, name: item.name, price: item.price, qty: item.quantity });
            }
        });
    });

    const result = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        employee: finalEmployeeName,
        totalVentas: (rawExpectedCash - abonosEfectivo) + (nequiTotal - abonosNequi),
        expectedCash: expectedCash,
        countedCash: countedCash,
        nequiTotal: nequiTotal,
        abonosEfectivo: abonosEfectivo,
        abonosNequi: abonosNequi,
        diff: diff,
        ordersCount: currentShiftOrders.length,
        manualItems: manualItems,
        expensesList: currentShiftExpenses,
        totalExpensesAmount: totalExpensesAmount,
        totalAdjustments: totalAdjustments, 
        isAuto: isAuto
    };

    const batch = db.batch();
    batch.set(db.collection('shifts').doc(result.id.toString()), result);
    
    // Marcamos como cerrados solo los documentos que entraron en este reporte
    currentShiftOrders.forEach(o => batch.update(db.collection('orders').doc(o.id.toString()), { shiftId: result.id }));
    currentShiftExpenses.forEach(e => batch.update(db.collection('expenses').doc(e.id.toString()), { shiftId: result.id }));
    currentShiftAbonos.forEach(a => batch.update(db.collection('abonos').doc(a.id.toString()), { shiftId: result.id }));
    currentShiftAdjustments.forEach(a => batch.update(db.collection('cashAdjustments').doc(a.id.toString()), { shiftId: result.id }));

    // IMPORTANTE: Solo liberamos mesas si es un Cierre General
    if (isGeneralClosure) {
        tables.forEach(t => {
            batch.update(db.collection('tables').doc(t.id.toString()), { status: 'libre', currentTotal: 0 });
            batch.delete(db.collection('activeOrders').doc(t.id.toString()));
        });
    }

    await batch.commit();
    if(!isAuto) setClosureResult(result);
};

                    {currentTrack?.item ? (
                        <div className="relative">
                            <div className="absolute -inset-4 bg-mandre-sage/20 rounded-[3rem] blur-2xl group-hover:bg-mandre-sage/30 transition-all duration-700"></div>
                            <img 
                                src={currentTrack.item.album.images[0].url} 
                                className={`w-56 h-56 mx-auto rounded-[2.5rem] shadow-2xl relative z-10 transition-all duration-700 ${currentTrack.is_playing ? 'rotate-2 scale-105' : 'grayscale opacity-80'}`} 
                            />
                            {currentTrack.is_playing && (
                                <div className="absolute -bottom-2 -right-2 z-20 bg-white p-3 rounded-full shadow-xl animate-bounce-slight">
                                    <Activity size={20} className="text-green-500"/>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div className="w-56 h-56 mx-auto bg-gray-100 rounded-[2.5rem] flex items-center justify-center border-4 border-dashed border-gray-200">
                            <Coffee size={48} className="text-gray-200 animate-pulse"/>
                        </div>
                    )}
                </div>

                {/* Información de la Canción */}
                <div className="text-center mb-10">
                    <h4 className="font-black text-xl text-mandre-dark truncate px-4">
                        {currentTrack?.item?.name || "Silencio en Mandré"}
                    </h4>
                    <p className="text-xs font-bold text-mandre-sage uppercase tracking-widest mt-1">
                        {currentTrack?.item?.artists[0].name || "Conecta tu dispositivo"}
                    </p>
                </div>

                {/* Controles de Reproducción Táctiles */}
                <div className="flex justify-center items-center gap-8 mb-10">
                    <button onClick={() => controlSpotify('previous')} className="text-gray-300 hover:text-mandre-coffee transition-colors active:scale-90"><SkipBack size={32}/></button>
                    
                    <button 
                        onClick={() => controlSpotify(currentTrack?.is_playing ? 'pause' : 'play')}
                        className="w-20 h-20 bg-mandre-coffee text-white rounded-full flex items-center justify-center shadow-[0_15px_30px_rgba(62,39,35,0.3)] hover:scale-105 active:scale-95 transition-all"
                    >
                        {currentTrack?.is_playing ? <Pause size={36} fill="currentColor"/> : <Play size={36} fill="currentColor" className="ml-1"/>}
                    </button>

                    <button onClick={() => controlSpotify('next')} className="text-gray-300 hover:text-mandre-coffee transition-colors active:scale-90"><SkipForward size={32}/></button>
                </div>

                {/* Listas Autorizadas */}
                <div className="text-left">
                    <p className="text-[9px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 ml-4">Playlists del Ambiente</p>
                    <div className="space-y-2 max-h-48 overflow-y-auto pr-2 scrollbar-hide">
                        {(musicPlaylists || []).map(pl => (
                            <button 
                                key={pl.id} 
                                onClick={() => reproducirSpotify(pl.uri)}
                                className="w-full flex items-center gap-4 p-4 bg-gray-50 rounded-3xl hover:bg-mandre-sage/10 transition-all border-2 border-transparent hover:border-mandre-sage/20 group"
                            >
                                <span className="text-2xl group-hover:scale-125 transition-transform">{pl.icon}</span>
                                <div className="text-left flex-1">
                                    <p className="font-bold text-sm text-gray-700 group-hover:text-mandre-coffee">{pl.name}</p>
                                    <p className="text-[9px] text-gray-400 font-bold uppercase">{pl.desc}</p>
                                </div>
                            </button>
                        ))}
                    </div>
                </div>
            </div>
            <button 
                onClick={() => setShowMusicPanel(false)} 
                className="w-full py-6 bg-gray-50 text-[10px] font-black text-gray-400 uppercase tracking-[0.4em] hover:bg-gray-100 transition-colors"
            >
                Regresar al POS
            </button>
        </div>
    </div>
)}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <div id="install-banner" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] hidden">
        <button id="btn-install" class="bg-[#3E2723] text-white px-8 py-4 rounded-full shadow-2xl font-bold flex items-center gap-2 animate-bounce border-2 border-white">
            <span>📲 INSTALAR APP MANDRÉ</span>
        </button>
    </div>

    <script>
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const btnInstall = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('✅ Chrome detectó que Mandré puede ser App');
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBanner.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.add('hidden');
            alert('¡Listo! Abre MANDRÉ desde tu menú de aplicaciones.');
        });
    </script>
</body>
</html>
