        // --- MODIFICACIÓN PASO 1: ESCUCHA ULTRA-SENSIBLE (Línea 210) ---
const syncCollection = (collectionName, initialData, stateSetter) => {
    // Agregamos includeMetadataChanges para forzar la actualización inmediata
    return db.collection(collectionName).onSnapshot({ includeMetadataChanges: true }, snap => {
        if (snap.empty && initialData) {
            const batch = db.batch();
            initialData.forEach(item => {
                const ref = db.collection(collectionName).doc(item.id.toString());
                batch.set(ref, item);
            });
            batch.commit();
        } else {
            stateSetter(snap.docs.map(doc => doc.data()));
        }
    });
};

        const App = () => {
            // --- ESTADO PARA EL PORTAL DE ASISTENCIA TANALZA ---
const [bioModal, setBioModal] = useState({ 
    isOpen: false, 
    title: '', 
    message: '', 
    type: 'error' 
});


// 1. Función para Registrar la Huella (VERSIÓN PASSKEY MÁGICA)
const registrarHuella = async (username) => {
    if (!window.PublicKeyCredential) {
        return setBioModal({ isOpen: true, title: 'NO SOPORTADO', message: 'Tu dispositivo no soporta biometría.', type: 'error' });
    }

    try {
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);

        const createCredentialOptions = {
            publicKey: {
                challenge,
                rp: { name: "Mandré POS" },
                user: {
                    // AQUÍ ESTÁ LA MAGIA: Metemos tu nombre de usuario convertido en código dentro de la huella
                    id: Uint8Array.from(username, c => c.charCodeAt(0)), 
                    name: username,
                    displayName: username,
                },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                authenticatorSelection: { 
                    userVerification: "preferred",
                    residentKey: "required", // <-- OBLIGA AL EQUIPO A RECORDAR QUIÉN ERES
                    requireResidentKey: true
                },
                timeout: 60000,
                attestation: "none",
            },
        };

        const credential = await navigator.credentials.create(createCredentialOptions);
        
        const credentialId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
        await db.collection('users_biometrics').doc(username).set({
            username,
            credentialId,
            active: true,
            device: navigator.userAgent
        });

        // Modal de éxito
        setBioModal({ 
            isOpen: true, 
            title: '¡BIOMETRÍA MÁGICA ACTIVADA!', 
            message: 'Tu huella se registró con éxito. La próxima vez, deja la caja vacía y solo toca el botón.', 
            type: 'not_registered' 
        });

    } catch (err) {
        console.error(err);
        setBioModal({ isOpen: true, title: 'ERROR DE REGISTRO', message: 'No se pudo guardar la huella. ¿Cancelaste la operación?', type: 'error' });
    }
};
// 2. Función para Iniciar Sesión con Huella
const loginConHuella = async (username, onSuccess) => {
    // 1. Validar soporte del dispositivo
    if (!window.PublicKeyCredential) {
        return setBioModal({
            isOpen: true,
            title: 'NO SOPORTADO',
            message: 'Tu dispositivo o navegador no soporta biometría. Usa tu contraseña.',
            type: 'error'
        });
    }

    // 2. Validar que escribió el usuario
    if (!username) {
        return setBioModal({
            isOpen: true,
            title: 'USUARIO REQUERIDO',
            message: 'Para ingresar con huella, primero escribe tu usuario o correo en la casilla superior.',
            type: 'not_registered'
        });
    }

    try {
        // 3. Buscar si tiene huella en Firebase
        const bioDoc = await db.collection('users_biometrics').doc(username).get();

        if (!bioDoc.exists || !bioDoc.data().active) {
            return setBioModal({
                isOpen: true,
                title: 'HUELLA NO REGISTRADA',
                message: `El usuario "${username}" no tiene huella en este equipo. Ingresa con contraseña y toca "Activar biometría".`,
                type: 'not_registered'
            });
        }

        const bioData = bioDoc.data();

        // 4. Preparar la petición al lector de huellas
        const challenge = new Uint8Array(32);
        window.crypto.getRandomValues(challenge);
        const rawId = Uint8Array.from(atob(bioData.credentialId), c => c.charCodeAt(0));

        const getCredentialOptions = {
            publicKey: {
                challenge: challenge,
                allowCredentials: [{
                    id: rawId,
                    type: 'public-key',
                    transports: ['internal', 'hybrid'] 
                }],
                timeout: 60000,
                userVerification: 'preferred'
            }
        };

        // 5. Lanzar el lector de huellas del dispositivo
        const assertion = await navigator.credentials.get(getCredentialOptions);

        if (assertion) {
            // 6. Huella válida: Buscar al usuario en la base de datos local para dejarlo pasar
            const user = users.find(u => u.username === username || u.email === username);
            
            if (user) {
                onSuccess(user); // Deja entrar al usuario
            } else {
                setBioModal({
                    isOpen: true,
                    title: 'ERROR DE SINCRONIZACIÓN',
                    message: 'Huella correcta, pero el usuario no aparece en la base de datos de MANDRÉ.',
                    type: 'error'
                });
            }
        }

    } catch (err) {
        console.error("Error en lectura de huella:", err);
        // Esto salta si el usuario cancela la lectura o pone mal el dedo muchas veces
        setBioModal({
            isOpen: true,
            title: 'LECTURA FALLIDA',
            message: 'No pudimos reconocer tu huella o cancelaste la acción. Intenta de nuevo o usa tu contraseña.',
            type: 'error'
        });
    }
};

// 1. Iniciar Sesión con PKCE (Bloque Completo Corregido)
const loginSpotify = async () => {
    const clientId = "1fbda3da9ebd415597ec57f265fbb451";
    const redirectUri = "https://tanalza-app-dguk.vercel.app/";

    const generateRandomString = (length) => {
        const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        return Array.from(crypto.getRandomValues(new Uint8Array(length)))
            .map((x) => possible[x % possible.length]).join('');
    };

    const codeVerifier = generateRandomString(64);
    const sha256 = async (plain) => {
        const encoder = new TextEncoder();
        const data = encoder.encode(plain);
        return window.crypto.subtle.digest('SHA-256', data);
    };

    const base64encode = (input) => {
        return btoa(String.fromCharCode(...new Uint8Array(input)))
            .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    };

    const hashed = await sha256(codeVerifier);
    const codeChallenge = base64encode(hashed);

    window.localStorage.setItem('code_verifier', codeVerifier);

    const scopes = "user-read-playback-state user-modify-playback-state user-read-currently-playing streaming";
    
    // --- LÍNEA CLAVE CORREGIDA CON BACKTICKS ---
    const authUrl = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${encodeURIComponent(scopes)}&code_challenge_method=S256&code_challenge=${codeChallenge}`;
    
    window.top.location.href = authUrl; // Cambié a window.top por seguridad en Vercel
};

    try {
        const res = await fetch(`https://api.spotify.com/v1/me/player/play`, {
            method: 'PUT',

            headers: { 'Authorization': `Bearer ${spotifyToken}` }

            alert("⚠️ No hay reproductor activo. Abre Spotify en tu celular, dale 'Play' a cualquier canción y luego intenta cambiarla desde aquí.");

const performClosure = async (isAuto = false, targetEmployee = null) => {
    const employeeToFilter = targetEmployee || currentShiftEmployee;
    const isGeneralClosure = targetEmployee === "GENERAL";

    const currentShiftOrders = orders.filter(o => !o.shiftId && o.method !== 'credito' && (isGeneralClosure ? true : o.employee === employeeToFilter));
    const currentShiftExpenses = expenses.filter(e => !e.shiftId && (isGeneralClosure ? true : e.employee === employeeToFilter));
    const currentShiftAbonos = abonos.filter(a => !a.shiftId && (isGeneralClosure ? true : a.employee === employeeToFilter));
    const currentShiftAdjustments = cashAdjustments.filter(a => !a.shiftId && (isGeneralClosure ? true : a.employee === employeeToFilter));
    
    if (!isAuto && currentShiftOrders.length === 0 && currentShiftAbonos.length === 0 && currentShiftAdjustments.length === 0) {
        return alert(`El usuario ${employeeToFilter} no tiene ventas ni bases registradas para cerrar.`);
    }

    let rawExpectedCash = currentShiftOrders.filter(o => o.method === 'efectivo').reduce((acc, o) => acc + o.total, 0);
    let nequiTotal = currentShiftOrders.filter(o => o.method === 'transferencia').reduce((acc, o) => acc + o.total, 0);

    const abonosEfectivo = currentShiftAbonos.filter(a => a.method === 'efectivo').reduce((acc, a) => acc + a.amount, 0);
    const abonosNequi = currentShiftAbonos.filter(a => a.method === 'transferencia').reduce((acc, a) => acc + a.amount, 0);

    // Separar Ajustes y Bases entre Efectivo y Nequi
    const adjEfectivo = currentShiftAdjustments.filter(a => a.method === 'efectivo' || !a.method).reduce((acc, a) => acc + a.amount, 0);
    const adjNequi = currentShiftAdjustments.filter(a => a.method === 'transferencia').reduce((acc, a) => acc + a.amount, 0);

    rawExpectedCash += abonosEfectivo;
    nequiTotal += abonosNequi;
    nequiTotal += adjNequi; // Sumamos o restamos ajustes que se hicieron por Nequi

    const totalExpensesAmount = currentShiftExpenses.reduce((acc, e) => acc + e.amount, 0);
    const totalAdjustments = adjEfectivo + adjNequi; // Para tracking global
    
    // Efectivo final esperado en la caja fuerte
    let expectedCash = rawExpectedCash - totalExpensesAmount + adjEfectivo;

    const countedCash = isAuto ? 0 : calculateCountedTotal();
    const diff = countedCash - expectedCash;
    const finalEmployeeName = isGeneralClosure ? "CIERRE GENERAL" : employeeToFilter;
    
    const manualItems = [];
    currentShiftOrders.forEach(order => {
        order.items.forEach(item => {
            if (item.id.toString().startsWith('manual_')) manualItems.push({ date: order.date, name: item.name, price: item.price, qty: item.quantity });
        });
    });

    const result = {
        id: Date.now(), date: new Date().toLocaleString(), employee: finalEmployeeName,
        totalVentas: (rawExpectedCash - abonosEfectivo) + (nequiTotal - abonosNequi - adjNequi),
        expectedCash: expectedCash, countedCash: countedCash, nequiTotal: nequiTotal,
        abonosEfectivo: abonosEfectivo, abonosNequi: abonosNequi,
        adjEfectivo: adjEfectivo, adjNequi: adjNequi, // Guardar el tracking de ajustes en el ticket
        diff: diff, ordersCount: currentShiftOrders.length, manualItems: manualItems,
        expensesList: currentShiftExpenses, totalExpensesAmount: totalExpensesAmount, totalAdjustments: totalAdjustments, isAuto: isAuto
    };

    const batch = db.batch();
    batch.set(db.collection('shifts').doc(result.id.toString()), result);
    currentShiftOrders.forEach(o => batch.update(db.collection('orders').doc(o.id.toString()), { shiftId: result.id }));
    currentShiftExpenses.forEach(e => batch.update(db.collection('expenses').doc(e.id.toString()), { shiftId: result.id }));
    currentShiftAbonos.forEach(a => batch.update(db.collection('abonos').doc(a.id.toString()), { shiftId: result.id }));
    currentShiftAdjustments.forEach(a => batch.update(db.collection('cashAdjustments').doc(a.id.toString()), { shiftId: result.id }));

    if (isGeneralClosure) {
        tables.forEach(t => {
            batch.update(db.collection('tables').doc(t.id.toString()), { status: 'libre', currentTotal: 0 });
            batch.delete(db.collection('activeOrders').doc(t.id.toString()));
        });
    }

    await batch.commit();
    if(!isAuto) setClosureResult(result);
};

                    {toast.show && (
                        <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[300] animate-slideUp px-4 w-full max-w-sm">
                            <div className={`px-6 py-4 rounded-[2rem] shadow-2xl border-2 flex items-center gap-4 ${toast.type === 'success' ? 'bg-white border-mandre-sage text-mandre-coffee' : 'bg-red-50 border-red-200 text-red-600'}`}>
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${toast.type === 'success' ? 'bg-mandre-sage text-white' : 'bg-red-500 text-white'}`}>
                                    {toast.type === 'success' ? <CheckCircle size={20}/> : <AlertTriangle size={20}/>}
                                </div>
                                <div className="text-left">
                                    <p className="text-[9px] font-black uppercase tracking-[0.2em] opacity-50 leading-none mb-1">Notificación</p>
                                    <p className="text-xs font-bold uppercase tracking-tight leading-tight">{toast.message}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <div id="install-banner" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] hidden">
        <button id="btn-install" class="bg-[#3E2723] text-white px-8 py-4 rounded-full shadow-2xl font-bold flex items-center gap-2 animate-bounce border-2 border-white">
            <span>📲 INSTALAR APP MANDRÉ</span>
        </button>
    </div>

    <script>
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const btnInstall = document.getElementById('btn-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('✅ Chrome detectó que Mandré puede ser App');
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBanner.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.add('hidden');
            alert('¡Listo! Abre MANDRÉ desde tu menú de aplicaciones.');
        });
    </script>
</body>
</html>
